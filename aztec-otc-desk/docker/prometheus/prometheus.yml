global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'aztec-otc-dev'
    environment: 'development'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alert_rules.yml"

# Scrape configuration
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics
    scrape_interval: 30s

  # Orderflow Service (Backend API)
  - job_name: 'orderflow-api'
    static_configs:
      - targets: ['host.docker.internal:3001']
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    honor_labels: true
    params:
      format: ['prometheus']

  # Web Application
  - job_name: 'web-app'
    static_configs:
      - targets: ['host.docker.internal:5173']
    metrics_path: /api/metrics
    scrape_interval: 30s
    scrape_timeout: 10s

  # PostgreSQL Database
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    metrics_path: /metrics
    scrape_interval: 30s
    # Note: Requires postgres_exporter or pg_stat_statements integration

  # Redis Cache
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: /metrics
    scrape_interval: 30s
    # Note: Requires redis_exporter integration

  # Aztec Node (if metrics are exposed)
  - job_name: 'aztec-node'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    honor_labels: true

  # Aztec PXE
  - job_name: 'aztec-pxe'
    static_configs:
      - targets: ['host.docker.internal:8081']
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    honor_labels: true

  # Price Feed Service
  - job_name: 'price-feed'
    static_configs:
      - targets: ['price-feed:3002']
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # Node Exporter (system metrics) - uncomment if added
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #   scrape_interval: 30s

  # Docker metrics (if Docker daemon metrics are exposed)
  # - job_name: 'docker'
  #   static_configs:
  #     - targets: ['host.docker.internal:9323']
  #   metrics_path: /metrics
  #   scrape_interval: 30s

# Storage configuration handled via command line flags in docker-compose